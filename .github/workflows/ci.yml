name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            swift: '6.3.3'
            cuda: true

          - os: windows-latest
            swift: '6.3.3'
            cuda: true

          - os: windows-11-arm
            swift: '6.3.3'
            cuda: false

          - os: macos-latest
            swift: '6.3.3'
            cuda: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: ${{ matrix.swift }}

      - name: Install CUDA Toolkit
        if: matrix.cuda
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.3.1'
          method: network
          log-file-suffix: '${{ matrix.os }}.txt'

      - name: Show Swift version
        run: swift --version

      - name: Show CUDA version
        if: matrix.cuda
        run: nvcc --version

      - name: Build (debug)
        run: swift build

      - name: Test (debug)
        run: swift test

      - name: Build (release)
        run: swift build -c release

      - name: Test (release)
        run: swift test -c release

  static-linux:
    name: Static Linux (${{ matrix.sdk }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        sdk:
          - x86_64-swift-linux-musl
          - aarch64-swift-linux-musl
        swift:
          - '6.3.3'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Swift and Static Linux SDK
        uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: ${{ matrix.swift }}
          sdks: static-linux

      - name: Show Swift version and installed SDKs
        run: |
          swift --version
          swift sdk list

      - name: Build with Static Linux SDK (debug)
        run: swift build --swift-sdk ${{ matrix.sdk }}

      - name: Build with Static Linux SDK (release)
        run: swift build -c release --swift-sdk ${{ matrix.sdk }}
